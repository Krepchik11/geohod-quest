# Drop-in for podman-auto-update.timer. Install to:
#   ~/.config/systemd/user/podman-auto-update.timer.d/override.conf
#
# The stock timer fires ONCE A DAY. That is what made the VPS the slow half of
# every release: CI published a new image within minutes, and the backend picked
# it up whenever the timer next happened to run — so a frontend deployed in ~2
# minutes could spend the rest of the day calling a backend that could not serve
# it. .github/workflows/release.yml now holds the frontend back until the VPS is
# serving the new backend, which a daily reconcile would simply stall.
#
# Reconcile every minute instead. This keeps deployment PULL-based (the shape a
# GitOps reconcile loop uses): no inbound SSH key, no webhook listener, nothing
# exposed on the VPS, and a host that was offline during a release converges by
# itself when it comes back. The cost is one registry digest check per minute —
# nothing is downloaded and no unit is restarted unless a digest actually changed,
# and backend-image.yml guarantees the digest only changes when the backend does.

[Timer]
# Clears the inherited OnCalendar=daily. A drop-in ADDS triggers rather than
# replacing them, so without this empty assignment the daily fire would survive
# alongside the one-minute interval below.
OnCalendar=
OnBootSec=30s
OnUnitActiveSec=1min
# The stock unit spreads registry load with a delay of up to 15 minutes. A release
# gate cannot wait for a die roll.
RandomizedDelaySec=0
AccuracySec=1s
# Irrelevant at a one-minute interval, and it would fire a catch-up run at boot on
# top of OnBootSec above.
Persistent=false
