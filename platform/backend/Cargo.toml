[package]
name = "geohod-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
# Blocking HTTPS client for fetching Google's JWKS (social auth). Already compiled
# transitively via rust-s3/aws-creds with the SAME rustls(webpki-roots) feature, so
# this adds no new build cost and keeps the ring-based TLS stack (no aws-lc/openssl).
attohttpc = { version = "0.28", default-features = false, features = ["tls-rustls-webpki-roots", "json", "basic-auth"] }
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
bytes = "1"
dotenvy = "0.15.7"
hex = "0.4.3"
# OIDC ID-token verification for social sign-in (Google + Telegram). RS256/ES256/
# EdDSA via ring — no new TLS/crypto stack. Telegram advertises all three.
jsonwebtoken = "9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
# S3-compatible client for Cloudflare R2 media storage (rust-s3; lib name `s3`).
# rustls(ring) to match sqlx's TLS stack (no native-tls / aws-lc-rs / cmake).
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "json",
    "macros",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = [
    "trace",
    "cors",
    "timeout",
    # Negotiated response compression. The quest bundle is repetitive JSON and
    # is downloaded on a phone, on the street; br when the client takes it,
    # gzip otherwise. The default predicate already skips images and tiny
    # bodies, so content-addressed media is passed through untouched.
    "compression-br",
    "compression-gzip",
    # X-Content-Type-Options on every response (see build_router).
    "set-header",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Quest export archive (manifest + quest.json + media/*). Deflate only — no
# bzip2/lzma/zstd codecs, which would each pull in a separate C/Rust codec dep.
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = "0.1.91"

[dev-dependencies]
http-body-util = "0.1.3"
tower = "0.5.3"
ts-rs = { version = "11", features = ["serde-compat"] }
