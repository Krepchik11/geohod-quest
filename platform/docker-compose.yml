services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: geohod-postgres
    environment:
      POSTGRES_USER: geohod
      POSTGRES_PASSWORD: geohod
      POSTGRES_DB: geohod
    ports:
      - "5432:5432"
    volumes:
      - geohod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geohod -d geohod"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geohod-pgdata:
