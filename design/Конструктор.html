<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOHOD QUEST — конструктор под новую модель GameStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Prata&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="commerce/site-theme.css">
<link rel="stylesheet" href="ctor/admin-theme.css">
<link rel="stylesheet" href="player/theme.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="player/quest-data.js"></script>
<script src="player/matcher.js"></script>
<script type="text/babel" src="lib/design-canvas.jsx"></script>
<script type="text/babel" src="player/components.jsx"></script>
<script type="text/babel" src="ctor/screens.jsx"></script>
<script type="text/babel" src="ctor/editor.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="ctx" title="Конструктор — контекст" subtitle="Дельта к новой модели: 7 шаблонов с префиллами · структурный редактор ответов с живым тестом (та же isAnswerCorrect, что в плеере) · 4 зоны комикса · подарок и подсказка с заморозкой сумм · навигатор · гейты публикации · явный неизменяемый Publish с версиями">
        <DCPostIt>
          Главный сдвиг против старого редактора: вместо «текст + 1 картинка + следующая страница» —
          полный GameStep. Превью и мини-карточки пикера рендерятся настоящими компонентами плеера
          (никаких скриншотов-обманок). Статус-селект «Опубликован/Проект/Тест» заменён
          явной публикацией версий.
        </DCPostIt>
      </DCSection>

      <DCSection id="picker" title="Пикер шаблонов — два варианта" subtitle="A: сетка с живыми мини-превью (преемственность с Figma). B: список с пояснением префиллов — быстрее для опытного автора">
        <DCArtboard id="pick-a" label="A · Сетка с мини-превью плеера" width={1240} height={1180}><PickerGrid></PickerGrid></DCArtboard>
        <DCArtboard id="pick-b" label="B · Список с префиллами" width={1240} height={1080}><PickerList></PickerList></DCArtboard>
      </DCSection>

      <DCSection id="pages" title="Страницы квеста и версии" subtitle="Сортируемый список с пер-страничными гейтами; панель версий вместо мутабельного статуса">
        <DCArtboard id="pg" label="Список страниц + версии" width={1240} height={1340}><QuestPages></QuestPages></DCArtboard>
      </DCSection>

      <DCSection id="editor" title="Редактор страницы — интерактивный" subtitle="Правьте текст и ответы — превью обновляется живьём. «Тест ответа» использует общий матчер: попробуйте «в 1730», «1730 ГОД», «1731»">
        <DCArtboard id="ed" label="Пер-степ редактор · играть здесь" width={1240} height={2400}><StepEditor></StepEditor></DCArtboard>
      </DCSection>

      <DCSection id="publish" title="Публикация: гейты и снапшот" subtitle="Ошибки блокируют, предупреждения предупреждают; модалка проговаривает необратимость и заморозку">
        <DCArtboard id="gates" label="Чек-лист · 2 ошибки блокируют" width={1240} height={980}><PublishChecklist></PublishChecklist></DCArtboard>
        <DCArtboard id="gates-modal" label="Модалка Publish (после исправлений)" width={1240} height={980}><PublishChecklist withModal={true}></PublishChecklist></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App></App>);
</script>
</body>
</html>
