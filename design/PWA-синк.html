<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOHOD QUEST — PWA: офлайн, очередь событий, коррекции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Prata&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="player/theme.css">
<link rel="stylesheet" href="pwa/pwa.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="player/quest-data.js"></script>
<script src="player/matcher.js"></script>
<script type="text/babel" src="lib/design-canvas.jsx"></script>
<script type="text/babel" src="player/components.jsx"></script>
<script type="text/babel" src="pwa/screens.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="ctx" title="PWA-синк — контекст" subtitle="Модель SPEC: события (факты) неизменяемы и копятся локально; сервер сводит устройства и отвечает коррекциями. Игроку — человеческий язык, никакого техжаргона">
        <DCPostIt>
          Принципы: офлайн никогда не блокирует игру · очередь видна, но не навязчива ·
          коррекция объясняет причину и следствие · баланс может уходить в минус —
          подсказки не отзываются, овердрафт просто сводится в итоговую сумму ·
          мультидевайс не теряет шаги.
        </DCPostIt>
      </DCSection>

      <DCSection id="conn" title="Состояния соединения" subtitle="Баннер под топбаром: офлайн с очередью → отправка → готово (исчезает сам)">
        <DCArtboard id="c-off" label="Офлайн · 6 событий ждут" width={360} height={740}><BoardOfflineQueue></BoardOfflineQueue></DCArtboard>
        <DCArtboard id="c-sync" label="Онлайн · отправка" width={360} height={740}><BoardSyncing></BoardSyncing></DCArtboard>
        <DCArtboard id="c-done" label="Синхронизировано" width={360} height={740}><BoardSynced></BoardSynced></DCArtboard>
        <DCArtboard id="c-sheet" label="Шторка: очередь событий" width={360} height={740}><BoardSyncSheet></BoardSyncSheet></DCArtboard>
      </DCSection>

      <DCSection id="fixes" title="Коррекции после синка" subtitle="Два случая: пересведённый баланс (может быть и отрицательным — это норма) и попытка, ушедшая вперёд на другом устройстве">
        <DCArtboard id="f-bal" label="Баланс скорректирован" width={360} height={740}><BoardFixBalance></BoardFixBalance></DCArtboard>
        <DCArtboard id="f-dev" label="Мультидевайс: продолжить дальше" width={360} height={740}><BoardFixDevice></BoardFixDevice></DCArtboard>
      </DCSection>

      <DCSection id="proto" title="Играбельная симуляция" subtitle="Пульт справа: уйдите в офлайн, накопите события, вернитесь онлайн — увидите отправку очереди и демо-коррекцию баланса">
        <DCArtboard id="sim" label="Симуляция · играть здесь" width={760} height={760}><PwaProto></PwaProto></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App></App>);
</script>
</body>
</html>
