name: frontend-ci

# Quality gate ONLY — this does NOT deploy. On a PR it guards the merge; on
# `main` release.yml calls it and promotes the production build only after it
# passes. Vercel's Git integration still owns PREVIEW deploys, but no longer
# production: vercel.json disables Git deployments for `main` so the pipeline can
# hold the frontend back until the backend is live (see release.yml).
#
# It exists because `next build` alone runs neither eslint nor vitest.

on:
  pull_request:
    paths:
      - "platform/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # On `main` this runs as a STAGE of release.yml rather than on its own push
  # trigger, so it gates the production deploy instead of racing it.
  workflow_call:

defaults:
  run:
    working-directory: platform

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # ONE lockfile for the repository — the workspace root's. A second
          # lockfile inside frontend/ made CI install a tree no developer ran:
          # `npm install` at platform/ resolves against the root lock, and the
          # two disagreed on 300+ packages (react-is 17 vs 16, minimatch 10 vs
          # 3, resolve 1.x vs 2.0-next). A green CI proved nothing about the
          # tree the change was written against.
          cache-dependency-path: platform/package-lock.json

      - name: Install (deterministic)
        run: npm ci

      - name: Lint
        run: npm run lint -w frontend

      - name: Lint — design-system primitives
        run: npm run lint:ds -w frontend

      - name: Lint — stylesheet scope
        run: npm run lint:css-scope -w frontend

      - name: Typecheck
        run: npx tsc --noEmit -p frontend

      - name: Test
        run: npm test -w frontend

      - name: Build
        # A dummy base URL so the production build-time guard in lib/api.ts is
        # satisfied. This validates the bundle compiles; it is NOT the deployed
        # value (Vercel injects the real NEXT_PUBLIC_API_URL).
        env:
          NEXT_PUBLIC_API_URL: https://ci.invalid
        run: npm run build -w frontend
