name: backend-ci

# Quality gate ONLY — this does NOT build or push the deploy image (that is
# backend-image.yml). Its job is to run the Rust test suite so a regression can
# never reach a deploy: `cargo build --release` (the image build) compiles the
# binary WITHOUT the #[cfg(test)] modules, so it cannot catch a broken test or
# enforce invariants like "no mock data" / "an unpublished draft never reaches
# the store". This runs `cargo test` against a real Postgres so the in-memory
# AND PostgreSQL store paths (incl. the constructor SQL + migrations) are both
# exercised — the in-memory store is the executable spec, Postgres is parity.

on:
  pull_request:
    paths:
      - "platform/backend/**"
      - "platform/goldens/**"
      - ".github/workflows/backend-ci.yml"
  # On `main` this runs as a STAGE of release.yml rather than on its own push
  # trigger, so the suite gates the image build instead of racing it. A parallel
  # push trigger would let a regression be published while its test run is still
  # going.
  workflow_call:

defaults:
  run:
    working-directory: platform/backend

jobs:
  test:
    runs-on: ubuntu-latest

    # The pg_* tests self-skip without DATABASE_URL; providing one makes them run,
    # validating every PostgreSQL query and the consolidated schema migration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geohod
          POSTGRES_PASSWORD: geohod
          POSTGRES_DB: geohod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geohod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://geohod:geohod@localhost:5432/geohod

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel (1.96.0) + components; rustup honors
      # it automatically on the first cargo invocation.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/backend

      # The three gates platform/README.md has always claimed, two of which had
      # never actually run here: this job was `cargo test` alone, so formatting
      # and every clippy lint were enforced by prose in a repository whose stated
      # property is that its rules are enforced mechanically. Ordered cheapest
      # first, so a formatting slip fails in seconds rather than after the suite.
      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # 10.7% of this crate's source lines are doc comments, written in rustdoc
      # idiom with `[`Item`]` links — and nothing had ever rendered them, so five
      # of those links pointed at nothing (one at a function renamed long ago).
      # This is the gate for the largest documentation surface in the repository.
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test (in-memory + Postgres parity)
        run: cargo test --locked
