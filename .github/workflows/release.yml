name: release

# THE release pipeline for `main`. One ordered chain, because the frontend and the
# backend are two halves of one product and must never ship out of order:
#
#   quality gates ──> backend image ──> backend LIVE on the VPS ──> frontend promoted
#
# The link that matters is "backend LIVE": it polls the production `/health` until
# it reports the build id of THIS commit's backend sources, and only then is the
# frontend promoted. Before this pipeline existed the two halves ran on independent
# clocks — Vercel promoted a push in ~2 minutes, while the VPS only noticed a new
# image when `podman-auto-update`'s DAILY timer next fired — so a new frontend
# routinely called a backend up to a day behind that could not serve it.
#
# Properties worth knowing:
#
#  - A commit that does not touch the backend does not change its build id, so the
#    gate is already satisfied and passes on the first poll. No waiting, and no
#    needless container restart for a frontend-only or docs-only change.
#  - If the VPS never picks the image up, this run FAILS and the frontend is NOT
#    promoted. Production stays on the previous, self-consistent pair — the failure
#    mode is a stale-but-working site, never a broken one.
#  - The skew window is only ever closed in ONE direction. Between the backend
#    restart and the frontend promotion — and for as long as a PWA client holds a
#    cached bundle, which can be days — an OLD frontend talks to the NEW backend.
#    Ordering cannot fix that; API backward compatibility must. See "The invariant
#    this pipeline does not enforce" in platform/DEPLOYMENT.md.
#
# Operator prerequisites (one-time, see platform/DEPLOYMENT.md → "Releases"):
#   VPS      podman-auto-update.timer drop-in installed (reconcile every minute,
#            not daily) — otherwise every release stalls until the gate times out.
#   GitHub   A `Production` environment carrying the secret VERCEL_TOKEN and the
#            variables VERCEL_ORG_ID / VERCEL_PROJECT_ID. Asserted by `preflight`,
#            which every shipping step depends on. Jobs that use them must name
#            the environment — an environment's values are invisible otherwise.
#   Variable API_BASE_URL (optional; defaults to https://api.quest.geohod.ru)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: >-
          Rebuild the backend image even though its sources are unchanged. The
          only way to pick up a base-image security update, since the pipeline
          otherwise never rebuilds identical sources. Note the gate cannot observe
          such a rebuild landing — the build id is unchanged by definition — so it
          passes immediately and the frontend may be promoted while the API
          restarts.
        type: boolean
        default: false

# A newer release supersedes an older one, so cancel rather than queue: queueing
# would let an in-flight older run promote its older frontend AFTER the newer run
# already promoted its own.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every operator prerequisite the pipeline consumes, asserted BEFORE anything
  # ships. The chain's first irreversible act is pushing `:latest` to GHCR — the
  # VPS follows that tag on its own timer, so a push IS the deploy — and the last
  # act needs credentials this repository holds. Without this job the two are
  # ordered the wrong way round: the backend goes live, and only then does the
  # frontend step discover it cannot promote, leaving production permanently
  # half-shipped on a new backend with the previous frontend. It is not a
  # theoretical failure — every release from the pipeline's first run onward died
  # exactly there, on an unset VERCEL_TOKEN, reported as the Vercel CLI's
  # "You defined --token, but it's missing a value".
  #
  # `secrets` cannot be read in a job-level `if`, so the check is a step that
  # reads them through `env` and names the missing ones itself.
  #
  # `environment:` is not decoration. The credentials live on the `Production`
  # environment, and an environment's secrets and variables are invisible to a
  # job that does not name it — they expand to the empty string, silently. That
  # is precisely how a correctly-configured repository still produced
  # "--token, but it's missing a value": the values were there, the job just
  # could not see them.
  preflight:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Required release credentials are configured
        shell: bash
        env:
          # A token is a credential (secret); an org/project id is an identifier
          # that appears in URLs and in .vercel/project.json (variable). Masking
          # an id buys nothing and makes a failed deploy harder to read.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Refusing to release: ${missing[*]} are unset or empty on the «Production» environment, so the frontend could not be promoted. Nothing was built or deployed — production stays on its current, self-consistent frontend/backend pair. VERCEL_TOKEN is a secret; VERCEL_ORG_ID and VERCEL_PROJECT_ID are variables. Settings → Environments → Production; see platform/DEPLOYMENT.md → «Releases»."
            exit 1
          fi

          # Present is not the same as working, and the difference is a whole
          # release. Ask Vercel whether THIS token can read THAT project, which
          # is exactly what `vercel pull` will do at the end of the chain — with
          # the backend already live and no way back. Credentials that resolve
          # locally prove nothing about the ones this repository stores.
          #
          # Body discarded and only the status kept: the project payload is
          # noise, and nothing here should risk printing a credential.
          echo "Project id: ${VERCEL_PROJECT_ID}, scope: ${VERCEL_ORG_ID}."
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" || echo 000)"
          case "$code" in
            200) ;;
            401|403)
              echo "::error::Refusing to release: Vercel answered ${code} for project ${VERCEL_PROJECT_ID} in scope ${VERCEL_ORG_ID}. The stored VERCEL_TOKEN is rejected or cannot see that scope — it is expired, revoked, or was issued for a different account. Mint a new one (Vercel → Settings → Tokens) and replace the secret on the «Production» environment. Nothing was built or deployed."
              exit 1 ;;
            404)
              echo "::error::Refusing to release: Vercel answered 404 for project ${VERCEL_PROJECT_ID} in scope ${VERCEL_ORG_ID}. The token works, but that project/scope pair does not exist for it. Re-read both ids from «vercel link» (.vercel/project.json) and fix the variables on the «Production» environment. Nothing was built or deployed."
              exit 1 ;;
            *)
              echo "::error::Refusing to release: could not reach the Vercel API (status ${code}). Nothing was built or deployed; re-run when Vercel is reachable."
              exit 1 ;;
          esac
          echo "Vercel project \`${VERCEL_PROJECT_ID}\` reachable with the stored token." >> "$GITHUB_STEP_SUMMARY"

  # The release identity: a hash of the sources the backend image is built from.
  #
  # Deliberately NOT the commit sha. The gate compares this value against what the
  # live backend reports, so it must change exactly when the backend changes — a
  # commit sha would change on every push and leave the gate waiting forever for a
  # redeploy that a frontend-only commit never triggers.
  identity:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.compute.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute the backend build id
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          # Exactly the image's inputs: the crate and the goldens it embeds (minus
          # goldens/parity, which platform/.dockerignore keeps out of the context),
          # the .dockerignore that decides what the context contains, and the
          # recipe that turns them into an image. Hashing MORE than the image
          # contains only costs a needless restart; hashing LESS is a silent
          # correctness bug — a changed backend would satisfy the gate against the
          # old one and never deploy. When in doubt, hash it.
          manifest="$(
            {
              git ls-tree -r HEAD -- platform/backend platform/goldens platform/.dockerignore \
                | grep -v $'\tplatform/goldens/parity/' || true
              git ls-tree -r HEAD -- .github/workflows/backend-image.yml
            }
          )"
          files="$(printf '%s\n' "$manifest" | grep -c . || true)"
          # A typo in the paths above would silently hash an empty manifest into a
          # constant id that every release then "matches". Fail loudly instead.
          if [ "${files:-0}" -lt 10 ]; then
            echo "::error::Refusing to release: the backend source manifest has ${files} entries. The paths hashed into build_id are wrong."
            exit 1
          fi
          build_id="$(printf '%s\n' "$manifest" | sha256sum | cut -c1-12)"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Backend build id \`$build_id\` over $files source files." >> "$GITHUB_STEP_SUMMARY"

  # Gates, not afterthoughts: they run BEFORE anything is published. `cargo build
  # --release` (the image build) compiles without #[cfg(test)], so only these jobs
  # can stop a regression from reaching production.
  backend-tests:
    uses: ./.github/workflows/backend-ci.yml

  frontend-tests:
    uses: ./.github/workflows/frontend-ci.yml

  backend-image:
    # `preflight` gates the whole chain from here: this job's push of `:latest` is
    # what the VPS auto-updates from, so it is the first step that cannot be undone.
    needs: [preflight, identity, backend-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend-image.yml
    with:
      build_id: ${{ needs.identity.outputs.build_id }}
      # `inputs` is empty on a push, so this is false for every ordinary release.
      force_rebuild: ${{ inputs.force_rebuild == true }}

  # The gate. Everything above this line is preparation; this is what makes the
  # release ordered.
  backend-live:
    needs: [identity, backend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the VPS serves this backend
        shell: bash
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://api.quest.geohod.ru' }}
          EXPECTED: ${{ needs.identity.outputs.build_id }}
          # ~1 min for the reconcile timer + image pull + start + health probe,
          # with generous headroom for a slow pull on a small VPS.
          TIMEOUT_SECONDS: "900"
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + $TIMEOUT_SECONDS ))
          while :; do
            # Quiet in the loop — the API being briefly unreachable across its own
            # restart is expected, not an error. The three outcomes are told apart
            # by `observed`: a build id, `<no build_id>` (reachable, but running a
            # backend from before this field existed), or empty (unreachable).
            observed="$(curl -fsS --max-time 10 "$API_BASE/health" 2>/dev/null | jq -r '.build_id // "<no build_id>"' 2>/dev/null || true)"
            if [ "$observed" = "$EXPECTED" ]; then
              echo "Backend live on build $EXPECTED."
              echo "Backend live on build \`$EXPECTED\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$API_BASE/health reports build_id='${observed:-<unreachable>}' after ${TIMEOUT_SECONDS}s, expected '$EXPECTED'. The frontend was NOT promoted, so production stays on the previous frontend/backend pair."
              echo "Last response:"
              curl -sS --max-time 10 -i "$API_BASE/health" || true
              echo "The VPS did not pick the new image up. On the host, check:"
              echo "  systemctl --user list-timers | grep auto-update   # is the 1-minute drop-in installed?"
              echo "  journalctl --user -u podman-auto-update.service -n 50"
              echo "  podman auto-update                               # force it now, then re-run this workflow"
              exit 1
            fi
            echo "waiting — observed='${observed:-<unreachable>}' expected='$EXPECTED'"
            sleep 10
          done

  frontend:
    needs: [backend-live, frontend-tests]
    runs-on: ubuntu-latest
    # Same environment as `preflight`, for the same reason: without it these
    # three expand to empty and the Vercel CLI reports a missing token value.
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Every `vercel` command below runs from the REPO ROOT, not from
      # platform/frontend: the Vercel project's Root Directory is platform/frontend
      # and the CLI applies that setting itself — the same way the Git integration
      # did. Running from inside the directory makes the CLI resolve
      # platform/frontend/platform/frontend and fail to find the app.
      #
      # None of them pass `--token`. The CLI reads VERCEL_TOKEN from the
      # environment, which is Vercel's own documented CI practice: an explicit
      # flag puts the credential in the runner's process listing. It also made
      # the failure mode worse — an unset secret produced "you defined --token,
      # but it's missing a value" instead of a plain authentication error.
      #
      # The link is what tells the CLI WHICH project. Setting VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID in the environment does not: that mechanism appears
      # nowhere in this CLI's help or reference docs, and relying on it is why
      # every release died at "Retrieving project… Could not retrieve Project
      # Settings" while the very same token and ids answered 200 from the same
      # runner one job earlier. `--project` with `--team` is the documented
      # non-interactive form, and it writes the `.vercel/` the next three
      # commands read.
      - name: Link the Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --team "$VERCEL_ORG_ID"

      - name: Pull the production environment
        # Fetches the project's production env vars, incl. NEXT_PUBLIC_API_URL —
        # which is inlined into the bundle, so Vercel stays its single source of
        # truth rather than it being duplicated into repository secrets.
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Promote to production
        run: vercel deploy --prebuilt --prod
